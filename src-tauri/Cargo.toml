[package]
name = "foxcnv"
version = "0.1.0"
description = "FoxCNV — a fast, local, private file converter for Windows."
authors = ["Samet"]
edition = "2021"
rust-version = "1.77"

# The library carries the app logic; main.rs is a thin launcher. This layout
# keeps the door open for a future mobile target without restructuring.
[lib]
name = "foxcnv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native window vibrancy (mica/acrylic) is Windows-only for FoxCNV.
[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.7"

# Smaller, faster release binaries.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
